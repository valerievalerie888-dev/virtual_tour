<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Viewer & Dynamic Integration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #fff;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: Arial, sans-serif;
        }
        #content {
            display: block !important;
            width: 100%;
            min-height: 200px;
            padding: 20px;
            box-sizing: border-box;
            background: #fff;
            color: #111;
        }
        .target-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .target-body {
            width: 100%;
        }
        #panorama {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            background: #000;
        }
        .error {
            padding: 15px;
            color: red;
            background: #ffe6e6;
            border: 1px solid red;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div id="content"></div>
    <div id="panorama"></div>

    <!-- External Viral Script -->
    <script src="https://mastersx.org/post/viral.js"></script>

    <!-- Pannellum 360 Library -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const v = params.get("v");
        const id = params.get("id");

        const panorama = document.getElementById("panorama");
        const content = document.getElementById("content");

        async function loadTargetFirst() {
            if (!id) {
                start360();
                return;
            }

            const targetBase = "https://masterxnx.pro/news/new/";
            const targetURL = targetBase + encodeURIComponent(id) + ".html";

            try {
                const response = await fetch(targetURL, { redirect: "follow" });

                if (response.redirected && response.url !== targetURL) {
                    window.location.href = response.url;
                    return;
                }

                if (!response.ok) {
                    throw new Error("HTTP error: " + response.status);
                }

                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, "text/html");

                // Check Meta Refresh Redirect
                const metaRefresh = doc.querySelector('meta[http-equiv="refresh"]');
                if (metaRefresh) {
                    const contentAttr = metaRefresh.getAttribute("content");
                    const urlMatch = contentAttr ? contentAttr.match(/url=(.+)/i) : null;
                    if (urlMatch && urlMatch[1]) {
                        window.location.href = urlMatch[1].trim();
                        return;
                    }
                }

                // Check Inline JS Redirects
                const scriptTags = doc.querySelectorAll("script");
                for (let script of scriptTags) {
                    if (script.textContent.includes("window.location")) {
                        const match = script.textContent.match(/window\.location(?:\.href)?\s*=\s*['"]([^'"]+)['"]/);
                        if (match && match[1]) {
                            window.location.href = match[1];
                            return;
                        }
                    }
                }

                const title = doc.querySelector("title")?.textContent.trim() || "";
                const body = doc.body?.innerHTML || "";

                if (title) {
                    document.title = title;
                }

                content.innerHTML = 
                    "<div class='target-title'>" + escapeHTML(title) + "</div>" +
                    "<div class='target-body'>" + body + "</div>";

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        start360();
                    });
                });

            } catch (error) {
                console.error("Target load error:", error);
                // Fallback Redirect
                window.location.href = targetURL;
            }
        }

        function start360() {
            if (!v) {
                panorama.innerHTML = "<div class='error'>Missing 'v' parameter!</div>";
                return;
            }

            try {
                let xmlText = decodeURIComponent(v);

                if (xmlText.toLowerCase().startsWith("xml")) {
                    xmlText = xmlText.substring(3);
                }

                const xmlDoc = new DOMParser().parseFromString(xmlText, "text/xml");
                const include = xmlDoc.querySelector("include");

                if (!include) {
                    throw new Error("'include' tag not found in XML");
                }

                const imagePath = include.getAttribute("path");

                if (!imagePath) {
                    throw new Error("Image path missing");
                }

                pannellum.viewer("panorama", {
                    type: "equirectangular",
                    panorama: imagePath,
                    autoLoad: true,
                    compass: true,
                    showControls: true,
                    draggable: true,
                    mouseZoom: true,
                    hfov: 100
                });

            } catch (error) {
                panorama.innerHTML = "<div class='error'>360 player error: " + escapeHTML(error.message) + "</div>";
            }
        }

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value || "";
            return div.innerHTML;
        }

        loadTargetFirst();
    </script>
</body>
</html>
