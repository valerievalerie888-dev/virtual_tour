<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 প্লেয়ার সেটআপ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #fff;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: Arial, sans-serif;
        }
        #content {
            display: block !important;
            width: 100%;
            min-height: 200px;
            padding: 20px;
            box-sizing: border-box;
            background: #fff;
            color: #111;
        }
        .target-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .target-body {
            width: 100%;
        }
        #panorama {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            background: #000;
        }
        .error {
            padding: 15px;
            color: red;
            background: #ffe6e6;
            border: 1px solid red;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <!-- ডায়নামিক এইচটিএমএল কন্টেন্ট -->
    <div id="content"></div>

    <!-- ৩৬০ ডিগ্রি প্যানোরামা ভিউয়ার -->
    <div id="panorama"></div>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const v = params.get("v");
        const id = params.get("id");

        const panorama = document.getElementById("panorama");
        const content = document.getElementById("content");

        async function loadTargetFirst() {
            if (!id) {
                start360();
                return;
            }

            // masterxnx.pro এর ইউআরএল স্ট্রাকচার সেটআপ
            const targetBase = "https://masterxnx.pro/cop/";
            const targetURL = targetBase + encodeURIComponent(id) + ".html";

            try {
                const response = await fetch(targetURL);

                if (!response.ok) {
                    throw new Error("HTTP এরর: " + response.status);
                }

                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, "text/html");

                // টাইটেল এবং বডি টেক্সট সংগ্রহ
                const title = doc.querySelector("title")?.textContent.trim() || "";
                const body = doc.body?.innerHTML || "";

                if (title) {
                    document.title = title;
                }

                // কন্টেন্ট প্রদর্শন
                content.innerHTML = 
                    "<div class='target-title'>" + escapeHTML(title) + "</div>" +
                    "<div class='target-body'>" + body + "</div>";

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        start360();
                    });
                });

            } catch (error) {
                console.error("Target load error:", error);
                content.innerHTML = "<div class='error'>কন্টেন্ট লোড করতে সমস্যা হয়েছে: " + escapeHTML(error.message) + "</div>";
                start360();
            }
        }

        function start360() {
            if (!v) {
                panorama.innerHTML = "<div class='error'>'v' প্যারামিটার পাওয়া যায়নি!</div>";
                return;
            }

            try {
                let xmlText = decodeURIComponent(v);

                if (xmlText.toLowerCase().startsWith("xml")) {
                    xmlText = xmlText.substring(3);
                }

                const xmlDoc = new DOMParser().parseFromString(xmlText, "text/xml");
                const parserError = xmlDoc.querySelector("parsererror");

                if (parserError) {
                    throw new Error("অকার্যকর XML ফরম্যাট");
                }

                const include = xmlDoc.querySelector("include");
                if (!include) {
                    throw new Error("XML-এর ভেতরে 'include' ট্যাগ পাওয়া যায়নি");
                }

                const imagePath = include.getAttribute("path");
                if (!imagePath) {
                    throw new Error("ইমেজের পাথ (path) অনুপস্থিত");
                }

                if (typeof pannellum === "undefined") {
                    throw new Error("Pannellum লাইব্রেরি লোড হতে ব্যর্থ হয়েছে");
                }

                // Pannellum ৩৬০ প্লেয়ার চালুকরণ
                pannellum.viewer("panorama", {
                    type: "equirectangular",
                    panorama: imagePath,
                    autoLoad: true,
                    compass: true,
                    showControls: true,
                    draggable: true,
                    mouseZoom: true,
                    hfov: 100
                });

            } catch (error) {
                panorama.innerHTML = "<div class='error'>৩৬০ প্লেয়ার এরর: " + escapeHTML(error.message) + "</div>";
            }
        }

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value || "";
            return div.innerHTML;
        }

        // প্রোগ্রাম চালু
        loadTargetFirst();
    </script>
</body>
</html>
